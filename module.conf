# Human-readable module metadata.
# ABK does not parse this file directly.

ABK_MODULE_NAME="ABK Dirty SELinux Guard"
ABK_MODULE_VERSION="0.1.0"
ABK_MODULE_DESCRIPTION="Clean and block known dirty SELinux policy grants after ABK source patching."
ABK_MODULE_SUPPORTED_STAGES="after_patch,before_build"

# Strict mode fails the build when a targeted rule remains after cleanup.
ABK_DIRTY_SEPOLICY_STRICT="${ABK_DIRTY_SEPOLICY_STRICT:-1}"
